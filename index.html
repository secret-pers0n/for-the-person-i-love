<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safina Sarah Zaheera 🤍❤️</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="scene">
    
    <!-- 💌 ENVELOPE STAGE -->
    <div id="envelope-wrapper" class="stage active">
      <div id="envelope" onclick="openEnvelope()">
        <div class="back"></div>
        <div class="letter-inside"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="letter-preview">💌 Tap to open</div>
      </div>
    </div>
    
    <!-- 📓 BINDER / NOTEBOOK LETTER STAGE -->
    <div id="letter-wrapper" class="stage">
      <div class="notebook">
        <!-- Rings Binder decoration -->
        <div class="binder-rings">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        
        <div class="notebook-content">
          <h1>My Love ❤️</h1>
          <div class="text-container">
            <p id="text"></p>
          </div>
          <button id="next-btn" class="hidden" onclick="transitionToProposal()">Lanjutkan ❤️</button>
        </div>
      </div>
    </div>
    
    <!-- 💍 PROPOSAL STAGE -->
    <div id="proposal-wrapper" class="stage">
      <div id="proposal">
        <div id="ring">💍</div>
        <h2>Will you keep loving me forever?</h2>
        <button class="btn-action" onclick="takeRing()">Take the Ring ❤️</button>
      </div>
    </div>

  </div>

  <audio id="music" loop>
    <source src="music/ikaw-at-ako.mp3" type="audio/mpeg">
  </audio>
  
  <!-- 💖 CUSTOM POPUP MODAL -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">💍✨</div>
      <p id="modal-message">I know you love me deeply, and I feel the same way, I hope we stay together and become a couple who succeeds together.</p>
      <button class="btn-action" onclick="closeModal()">Sama-Sama Baby ❤️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

  <script src="script.js"></script>
  
</body>
</html>
